<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sumon Miya | Digital Card</title>

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at top left, #263247 0%, transparent 35%),
            radial-gradient(circle at bottom right, #111827 0%, transparent 40%),
            #05070b;
        color: #fff;
    }

    .card-wrap {
        width: 100%;
        max-width: 430px;
        perspective: 1200px;
    }

    .card {
        position: relative;
        width: 100%;
        min-height: 600px;
        padding: 25px;
        overflow: hidden;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.18);
        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,0.12),
                rgba(255,255,255,0.025)
            );
        box-shadow:
            0 30px 70px rgba(0,0,0,0.55),
            inset 0 1px 1px rgba(255,255,255,0.18),
            inset 0 -1px 1px rgba(0,0,0,0.5);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }

    .card::before {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        top: -150px;
        right: -130px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        filter: blur(5px);
    }

    .card::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        bottom: -100px;
        left: -90px;
        border-radius: 50%;
        background: rgba(255,255,255,0.035);
    }

    .top-bar {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
    }

    .brand {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.72);
    }

    .card-type {
        padding: 7px 12px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.8);
    }

    /* Profile */
    .profile-section {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 25px;
    }

    .profile-photo {
        width: 125px;
        height: 125px;
        flex-shrink: 0;
        padding: 4px;
        border-radius: 50%;
        background: linear-gradient(
            145deg,
            rgba(255,255,255,0.75),
            rgba(255,255,255,0.08)
        );
        box-shadow:
            0 10px 30px rgba(0,0,0,0.35),
            inset 0 1px 1px rgba(255,255,255,0.5);
    }

    .profile-photo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid rgba(0,0,0,0.35);
    }

    .qr-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 105px;
        height: 105px;
        padding: 8px;
        border-radius: 18px;
        background: #fff;
        box-shadow:
            0 12px 30px rgba(0,0,0,0.35),
            inset 0 1px 1px rgba(255,255,255,0.8);
    }

    #qrcode {
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
        width: 88px !important;
        height: 88px !important;
        display: block;
    }

    /* Identity */
    .identity {
        position: relative;
        z-index: 2;
        margin-bottom: 20px;
    }

    .identity h1 {
        font-size: 31px;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.8px;
        margin-bottom: 7px;
    }

    .identity .role {
        font-size: 14px;
        color: rgba(255,255,255,0.58);
        letter-spacing: 0.8px;
    }

    .verified {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin-left: 5px;
        border-radius: 50%;
        font-size: 10px;
        background: #1683ff;
        color: #fff;
        vertical-align: middle;
    }

    /* Four Action Buttons */
    .actions {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
        margin-bottom: 14px;
    }

    .action-btn {
        min-height: 62px;
        border: 1px solid rgba(255,255,255,0.11);
        border-radius: 15px;
        background: rgba(255,255,255,0.055);
        color: #fff;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 10px;
        cursor: pointer;
        transition: 0.25s ease;
    }

    .action-btn i {
        font-size: 19px;
    }

    .action-btn:hover {
        transform: translateY(-3px);
        background: rgba(255,255,255,0.1);
    }

    .action-btn.call i {
        color: #60a5fa;
    }

    .action-btn.whatsapp i {
        color: #25d366;
    }

    .action-btn.facebook i {
        color: #1877f2;
    }

    .action-btn.email i {
        color: #f87171;
    }

    /* Address */
    .details {
        position: relative;
        z-index: 2;
        margin-bottom: 15px;
    }

    .detail-row {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 48px;
        padding: 10px 13px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        background: rgba(255,255,255,0.045);
        border: 1px solid rgba(255,255,255,0.075);
        transition: 0.25s ease;
    }

    .detail-row:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.16);
    }

    .detail-icon {
        width: 31px;
        height: 31px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border-radius: 10px;
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.9);
    }

    .detail-text {
        min-width: 0;
    }

    .detail-label {
        display: block;
        margin-bottom: 2px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.42);
    }

    .detail-value {
        display: block;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* CV Button */
    .cv-button {
        position: relative;
        z-index: 2;
        width: 100%;
        min-height: 53px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: 15px;
        text-decoration: none;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
        background: rgba(255,255,255,0.09);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow:
            0 10px 25px rgba(0,0,0,0.2),
            inset 0 1px 1px rgba(255,255,255,0.1);
        transition: 0.25s ease;
    }

    .cv-button:hover {
        transform: translateY(-3px);
        background: rgba(255,255,255,0.14);
    }

    .footer {
        position: relative;
        z-index: 2;
        text-align: center;
        margin-top: 17px;
        font-size: 9px;
        color: rgba(255,255,255,0.28);
        letter-spacing: 0.7px;
    }

    @media (max-width: 420px) {

        body {
            padding: 12px;
        }

        .card {
            min-height: auto;
            padding: 21px;
            border-radius: 24px;
        }

        .profile-photo {
            width: 105px;
            height: 105px;
        }

        .qr-box {
            width: 94px;
            height: 94px;
        }

        #qrcode,
        #qrcode img,
        #qrcode canvas {
            width: 78px !important;
            height: 78px !important;
        }

        .identity h1 {
            font-size: 27px;
        }

        .actions {
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .action-btn {
            min-height: 55px;
            border-radius: 12px;
            font-size: 9px;
        }

        .action-btn i {
            font-size: 17px;
        }
    }

    @media (max-width: 340px) {

        .actions {
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .action-btn {
            min-height: 55px;
        }
    }
</style>

</head><body><div class="card-wrap">
    <div class="card">    <!-- Header -->
    <div class="top-bar">
        <div class="brand">Digital Card</div>
        <div class="card-type">PERSONAL</div>
    </div>

    <!-- Profile Photo + QR Code -->
    <div class="profile-section">

        <div class="profile-photo">
            <img
                src="https://i.ibb.co.com/XfFM2H0v/file-00000000ad94821181c46e4f3c9eb86e.png"
                alt="Sumon Miya">
        </div>

        <div class="qr-box">
            <div id="qrcode"></div>
        </div>

    </div>

    <!-- Identity -->
    <div class="identity">

        <h1>
            Sumon Miya
            <span class="verified">
                <i class="fa-solid fa-check"></i>
            </span>
        </h1>

        <div class="role">Web Developer</div>

    </div>

    <!-- Four Contact Buttons -->
    <div class="actions">

        <!-- Direct Phone Dialer -->
        <a class="action-btn call"
           href="tel:+8801891707400">

            <i class="fa-solid fa-phone"></i>
            <span>Call</span>

        </a>

        <!-- WhatsApp -->
        <a class="action-btn whatsapp"
           href="https://wa.me/8801891707400?text=Hello%20Sumon%20Miya"
           target="_blank"
           rel="noopener noreferrer">

            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp</span>

        </a>

        <!-- Facebook -->
        <a class="action-btn facebook"
           href="https://www.facebook.com/hossain.sumon.676378"
           target="_blank"
           rel="noopener noreferrer">

            <i class="fa-brands fa-facebook-f"></i>
            <span>Facebook</span>

        </a>

        <!-- Email -->
        <a class="action-btn email"
           href="mailto:socialofficial411@gmail.com">

            <i class="fa-solid fa-envelope"></i>
            <span>Email</span>

        </a>

    </div>

    <!-- Address -->
    <div class="details">

        <a class="detail-row"
           href="https://www.google.com/maps/search/?api=1&query=Nabinagar%2C%20Savar%2C%20Dhaka%2C%20Bangladesh"
           target="_blank"
           rel="noopener noreferrer">

            <div class="detail-icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <div class="detail-text">
                <span class="detail-label">Address</span>

                <span class="detail-value">
                    Nabinagar, Savar, Dhaka, Bangladesh
                </span>
            </div>

        </a>

    </div>

    <!-- CV -->
    <a class="cv-button" href="cv.html">

        <i class="fa-solid fa-file-user"></i>

        CV &amp; Projects

    </a>

    <div class="footer">
        Digital Profile Card
    </div>

</div>

</div><script>
    // Website URL encoded into the QR code.
    // The URL itself is not displayed on the card.
    const websiteURL = "https://socialock.github.io/sumon/";

    new QRCode(document.getElementById("qrcode"), {
        text: websiteURL,
        width: 88,
        height: 88,
        colorDark: "#111318",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });
</script></body>
</html>
